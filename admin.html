<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Portal — Signage Basket</title>

  <!-- Google Fonts: Josefin Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Public CSS for plate previewing -->
  <link rel="stylesheet" href="/css/styles.css">
  <!-- Admin Styles -->
  <link rel="stylesheet" href="/admin-assets/admin.css">
</head>
<body class="admin-body">
  <div id="app" class="admin-app">
    <!-- Authenticated Layout (Sidebar + Main View) -->
    <div id="adminLayout" class="admin-layout" style="display: none;">
      <!-- Mobile Backdrop -->
      <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

      <!-- Left Sidebar -->
      <aside id="sidebar" class="admin-sidebar">
        <div class="sidebar-header">
          <a href="#/dashboard" class="sidebar-logo-link">
            <img src="/assets/logo/logo-wordmark-light.svg" alt="Signage Basket" class="sidebar-logo">
          </a>
          <button id="sidebarCloseBtn" class="sidebar-close-btn" aria-label="Close menu">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <nav class="sidebar-nav">
          <a href="#/dashboard" class="nav-item" data-route="dashboard">
            <span class="nav-icon"><svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg></span>
            <span class="nav-label">Dashboard</span>
          </a>

          <a href="#/enquiries" class="nav-item" data-route="enquiries">
            <span class="nav-icon"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
            <span class="nav-label">Enquiries</span>
            <span id="navEnquiriesBadge" class="nav-badge" style="display: none;">0</span>
          </a>

          <a href="#/designs" class="nav-item" data-route="designs">
            <span class="nav-icon"><svg class="svg-icon" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></span>
            <span class="nav-label">Designs</span>
          </a>

          <a href="#/projects" class="nav-item" data-route="projects">
            <span class="nav-icon"><svg class="svg-icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></span>
            <span class="nav-label">Projects</span>
          </a>

          <a href="#/reviews" class="nav-item" data-route="reviews">
            <span class="nav-icon"><svg class="svg-icon" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
            <span class="nav-label">Reviews</span>
          </a>

          <a href="#/media" class="nav-item" data-route="media">
            <span class="nav-icon"><svg class="svg-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></span>
            <span class="nav-label">Media</span>
          </a>

          <a href="#/settings" class="nav-item" data-route="settings">
            <span class="nav-icon"><svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
            <span class="nav-label">Settings</span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <a href="/" target="_blank" rel="noopener" class="sidebar-action-btn view-site-btn">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            <span>View website</span>
          </a>
          <button id="logoutBtn" class="sidebar-action-btn logout-btn">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Logout</span>
          </button>
        </div>
      </aside>

      <!-- Main Stage -->
      <div class="admin-main">
        <!-- Top App Bar -->
        <header class="admin-topbar">
          <div class="topbar-left">
            <button id="hamburgerBtn" class="hamburger-btn" aria-label="Toggle navigation">
              <svg class="svg-icon" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <h1 id="pageTitle" class="topbar-title">Dashboard</h1>
          </div>
          <div class="topbar-right">
            <a href="/" target="_blank" rel="noopener" class="btn btn-outline btn-sm">
              <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              <span>View website</span>
            </a>
          </div>
        </header>

        <!-- Dynamic Content Body -->
        <main id="mainContainer" class="admin-content"></main>
      </div>
    </div>

    <!-- Login Container -->
    <div id="loginLayout" class="login-layout" style="display: none;"></div>

    <!-- Slide-in Right Drawer -->
    <div id="drawerBackdrop" class="drawer-backdrop" style="display: none;"></div>
    <aside id="adminDrawer" class="admin-drawer" aria-hidden="true">
      <div class="drawer-header">
        <h2 id="drawerTitle" class="drawer-title">Details</h2>
        <button id="drawerCloseBtn" class="drawer-close-btn" aria-label="Close drawer">
          <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="drawerBody" class="drawer-body"></div>
    </aside>

    <!-- Modal Dialog (Confirmations / Forms) -->
    <div id="modalOverlay" class="modal-overlay" style="display: none;">
      <div class="modal-dialog">
        <div class="modal-header">
          <h3 id="modalTitle" class="modal-title">Confirm Action</h3>
          <button id="modalCloseBtn" class="drawer-close-btn" aria-label="Close modal">
            <svg class="svg-icon" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div id="modalBody" class="modal-body"></div>
        <div id="modalFooter" class="modal-footer"></div>
      </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="toast-container" aria-live="polite"></div>
  </div>

  <!-- Shared Site Assets for Preview & Starter Catalog -->
  <script src="/js/catalog.js"></script>
  <script src="/js/plates.js"></script>

  <!-- Core Admin App Entrypoint -->
  <script type="module" src="/admin-assets/core.js"></script>
</body>
</html>
